name: Deploy Azure Infrastructure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AZURE_RESOURCE_GROUP: demobicep

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep

      - name: What-If
        run: az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --parameters infra/environments/dev/main.bicepparam

      - name: Deploy Bicep
        run: az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" --parameters infra/environments/dev/main.bicepparam